name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: sales-website-backend
  REGION: asia-south1
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/sales-website-backend

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 4. Configure Docker to use gcloud as credential helper
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      # 5. Build the Docker image
      - name: Build Docker image
        run: |
          docker build \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            .

      # 6. Push image to Google Container Registry
      - name: Push Docker image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      # 7. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image "$IMAGE:$GITHUB_SHA" \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production" \
            --set-env-vars "MONGODB_CONNECTION_URL=${{ secrets.MONGODB_CONNECTION_URL }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}" \
            --set-env-vars "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --set-env-vars "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" \
            --set-env-vars "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" \
            --set-env-vars "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --set-env-vars "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" \
            --set-env-vars "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" \
            --set-env-vars "MSG91_AUTH_KEY=${{ secrets.MSG91_AUTH_KEY }}" \
            --set-env-vars "MSG91_TEMPLATE_ID=${{ secrets.MSG91_TEMPLATE_ID }}" \
            --set-env-vars "WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}" \
            --set-env-vars "WEBHOOK_ENABLED=true" \
            --set-env-vars "LEAD_FILTERATION_WEBHOOK_URL=${{ secrets.LEAD_FILTERATION_WEBHOOK_URL }}" \
            --set-env-vars "LEADGEN_BACKEND_URL=${{ secrets.LEADGEN_BACKEND_URL }}" \
            --set-env-vars "INTERNAL_API_SECRET=${{ secrets.INTERNAL_API_SECRET }}" \
            --set-env-vars "VOICE_API_BASE_URL=${{ secrets.VOICE_API_BASE_URL }}" \
            --set-env-vars "BYPASS_OTP=true" \
            --quiet
          # ⚠️ TEMPORARY FIX: BYPASS_OTP=true skips OTP verification during registration.
          # This was added on 2024-07-24 to unblock client registrations while MSG91 delivery is investigated.
          # TODO: Remove BYPASS_OTP=true once MSG91 OTP delivery is confirmed working reliably.

      # 8. Print the deployed service URL
      - name: Show deployed URL
        run: |
          gcloud run services describe $SERVICE_NAME \
            --region $REGION \
            --format "value(status.url)"
